<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Vetorial Multi-Camada Avançado - Infralobo</title>
  <!-- Fabric.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

  <style>
    /* -------------------------------------------------------------
       CARREGAMENTO DE FONTES LOCAIS (PASTA ./fonts/)
       ------------------------------------------------------------- */
    @font-face {
      font-family: 'Nunito';
      src: url('./fonts/Nunito-Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }

    @font-face {
      font-family: 'Inter';
      src: url('./fonts/Inter-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'Inter-Bold';
      src: url('./fonts/Inter-Bold.ttf') format('truetype');
      font-weight: bold;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      align-items: center;
      flex-wrap: wrap;
      z-index: 20;
    }

    .toolbar button,
    .toolbar label.btn-upload,
    .toolbar select,
    .toolbar input[type="number"] {
      background-color: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .toolbar button:hover,
    .toolbar label.btn-upload:hover,
    .toolbar select:hover {
      background-color: #475569;
      border-color: #64748b;
    }

    .toolbar button.active {
      background-color: #0d9488 !important;
      border-color: #14b8a6 !important;
      box-shadow: 0 0 6px rgba(20, 184, 166, 0.4);
    }

    .toolbar input[type="file"] { display: none; }

    .toolbar input[type="color"] {
      cursor: pointer;
      border: 1px solid #475569;
      background: transparent;
      width: 28px;
      height: 28px;
      border-radius: 4px;
    }

    .separator {
      width: 1px;
      height: 22px;
      background-color: #475569;
      margin: 0 2px;
    }

    .pen-subtools, .eraser-subtools, .text-subtools, .zoom-group {
      display: inline-flex;
      gap: 4px;
      background-color: #0f172a;
      padding: 3px 6px;
      border-radius: 6px;
      border: 1px solid #334155;
      align-items: center;
    }

    .zoom-level-text {
      font-size: 11px;
      font-weight: 600;
      color: #38bdf8;
      min-width: 42px;
      text-align: center;
    }

    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .ruler-container {
      display: grid;
      grid-template-columns: 24px 1fr;
      grid-template-rows: 24px 1fr;
      flex: 1;
      position: relative;
      background-color: #0f172a;
      overflow: hidden;
    }

    .ruler-corner {
      background-color: #1e293b;
      border-right: 1px solid #334155;
      border-bottom: 1px solid #334155;
      z-index: 15;
    }

    .ruler-top {
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      cursor: row-resize;
      position: relative;
      overflow: hidden;
      z-index: 14;
    }

    .ruler-left {
      background-color: #1e293b;
      border-right: 1px solid #334155;
      cursor: col-resize;
      position: relative;
      overflow: hidden;
      z-index: 14;
    }

    .main-container {
      position: relative;
      overflow: auto;
      background-color: #0f172a;
      display: flex;
      padding: 20px;
    }

    .canvas-wrapper {
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      background-color: #ffffff;
      margin: auto;
      position: relative;
    }

    .sidebar {
      width: 320px;
      background-color: #1e293b;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
      z-index: 20;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar h3 {
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .progress-box {
      display: none;
      background-color: #0f172a;
      border: 1px solid #0d9488;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      color: #14b8a6;
      flex-direction: column;
      gap: 5px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background-color: #334155;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background-color: #14b8a6;
      transition: width 0.1s ease;
    }

    .layer-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow-y: auto;
      flex: 1;
      scroll-behavior: smooth;
    }

    .folder-item {
      background-color: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      margin-bottom: 4px;
      overflow: hidden;
    }

    .folder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background-color: #334155;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .folder-header:hover { background-color: #475569; }

    .folder-content {
      padding: 4px 0 4px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      background-color: rgba(15, 23, 42, 0.4);
    }

    .layer-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      background-color: #334155;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
    }

    .layer-item:hover { border-color: #0d9488; }
    .layer-item.active { 
      background-color: #0d9488; 
      color: white; 
      border-color: #14b8a6;
    }

    .layer-item.is-path {
      border-left: 3px solid #38bdf8;
    }

    .layer-item .layer-info {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      flex: 1;
    }

    .layer-item .layer-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-icon {
      background: none;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      padding: 2px 4px;
      font-size: 11px;
      border-radius: 3px;
    }

    .btn-icon:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .status-msg {
      position: fixed;
      bottom: 12px;
      left: 12px;
      background-color: rgba(15, 23, 42, 0.95);
      color: #14b8a6;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      border: 1px solid #0d9488;
      display: none;
      z-index: 100;
    }

    .guide-line-h, .guide-line-v {
      position: absolute;
      background-color: #38bdf8;
      z-index: 12;
      pointer-events: auto;
    }
    .guide-line-h { height: 1px; width: 100%; cursor: row-resize; }
    .guide-line-v { width: 1px; height: 100%; cursor: col-resize; }
  </style>
</head>
<body>

  <!-- BARRA DE FERRAMENTAS SUPERIOR -->
  <div class="toolbar">
    <label class="btn-upload">
      📁 Importar SVG
      <input type="file" id="svgFileInput" accept=".svg" onchange="loadSVGFile(event)">
    </label>

    <div class="separator"></div>

    <button id="btnSelect" class="active" onclick="setActiveTool('select')">🖱️ Selecionar</button>
    <button id="btnHand" onclick="setActiveTool('hand')">✋ Mão (Arrastar)</button>
    
    <div class="eraser-subtools">
      <button id="btnEraser" onclick="setActiveTool('eraser')" style="background-color: #e11d48; border-color: #f43f5e;">🧹 Borracha</button>
      <label for="eraserSize" style="font-size: 11px; color: #cbd5e1;">Tam:</label>
      <input type="range" id="eraserSize" min="1" max="300" value="1" style="width: 70px; cursor: pointer;" oninput="updateEraserSize(this.value)">
      <span id="eraserSizeVal" style="font-size: 11px; color: #f43f5e; font-weight: 600;">1px</span>
    </div>

    <div class="pen-subtools">
      <button id="btnPath" onclick="setActiveTool('path')">📐 Pen</button>
      <button onclick="closeCurrentPath()" title="Fechar caminho">🔄 Fechar</button>
      <button onclick="finishPath()" title="Concluir caminho">✅ Concluir</button>
      <button onclick="cancelPath()" title="Cancelar caminho">❌</button>
    </div>

    <button id="btnPencil" onclick="setActiveTool('pencil')">✏️ Lápis Livre</button>

    <div class="separator"></div>

    <button id="btnGrid" onclick="toggleGrid()">🏁 Grelha</button>
    <button onclick="clearGuides()" title="Limpar todas as guias de alinhamento">📏 Limpar Guias</button>

    <div class="separator"></div>

    <button onclick="addRect()">🟦 Retângulo</button>
    <button onclick="addCircle()">🟠 Círculo</button>
    <button onclick="addLine()">➖ Linha</button>
    <button onclick="addText()">🔤 Texto</button>

    <!-- PAINEL DE CONTROLO DE TEXTO (FONTE, BOLD, ALINHAMENTO) -->
    <div class="text-subtools">
      <select id="fontSelect" onchange="updateFontFamily(this.value)" style="background-color: #0f172a; color: #38bdf8; font-weight: bold; border-color: #38bdf8;">
        <option value="Nunito" selected>🔤 Nunito (Logótipo)</option>
        <option value="Inter-Bold">🔤 Inter Bold (Títulos)</option>
        <option value="Inter">🔤 Inter Regular (Texto)</option>
        <option value="Helvetica, Arial, sans-serif">🔤 Arial / Helvetica</option>
      </select>

      <button id="btnBold" onclick="toggleBold()" title="Negrito / Bold" style="font-weight: 900; padding: 6px 10px;">B</button>
      <button id="btnAlignLeft" onclick="setTextAlignment('left')" title="Alinhar à Esquerda" class="active">⬅️</button>
      <button id="btnAlignCenter" onclick="setTextAlignment('center')" title="Alinhar ao Centro">↔️</button>
      <button id="btnAlignRight" onclick="setTextAlignment('right')" title="Alinhar à Direita">➡️</button>
    </div>

    <select id="symbolSelect" onchange="addSymbol(this.value)">
      <option value="" disabled selected>➕ Galeria de Símbolos...</option>
      <optgroup label="Infraestruturas e Obras">
        <option value="construction">🚧 Obras / Trabalho</option>
        <option value="water_tap">🚰 Água / Torneira</option>
        <option value="flash">⚡ Eletricidade / Energia</option>
        <option value="trash">🗑️ Resíduos / Contentor</option>
      </optgroup>
      <optgroup label="Sinalética e Informação">
        <option value="warning">⚠️ Sinal de Aviso</option>
        <option value="info">ℹ️ Ponto de Informação</option>
        <option value="location">📍 Localização / Pin</option>
      </optgroup>
      <optgroup label="Desporto e Natureza">
        <option value="padel">🎾 Padel / Ténis</option>
        <option value="tree">🌳 Árvore / Espaço Verde</option>
      </optgroup>
    </select>

    <div class="separator"></div>

    <select id="strokeDashSelect" onchange="updateStrokeStyle()">
      <option value="solid">― Traço Contínuo</option>
      <option value="dashed">--- Traço Descontínuo</option>
      <option value="dotted">··· Pontilhado</option>
    </select>

    <div class="separator"></div>

    <label for="fillColor" style="font-size: 11px;">Cor:</label>
    <input type="color" id="fillColor" value="#000000" onchange="updateColor(this.value)">

    <button onclick="ungroupSelected()" style="background-color: #0284c7; border-color: #38bdf8;">🔓 Desagrupar Avançado</button>

    <div class="separator"></div>

    <button onclick="saveToStorage()" style="background-color: #8b5cf6; border-color: #a78bfa;" title="Guardar no Browser (Ctrl+S)">💾 Guardar na Cache</button>
    <button onclick="loadFromStorage()" style="background-color: #6366f1; border-color: #818cf8;" title="Carregar do Browser">📂 Carregar da Cache</button>

    <div class="separator"></div>

    <button onclick="undo()" title="Desfazer Última Ação (Ctrl+Z)" style="background-color: #d97706; border-color: #f59e0b;">↩️ Undo</button>
    <button onclick="cutSelected()" title="Recortar Camada (Ctrl+X)">📋 Cortar</button>
    <button onclick="copySelected()" title="Copiar Camada (Ctrl+C)">📄 Copiar</button>
    <button onclick="pasteSelected()" title="Colar Camada (Ctrl+V)">📌 Colar</button>
    <button onclick="deleteSelected()" style="background-color: #ef4444; border-color: #f87171;">🗑️ Eliminar</button>

    <div class="separator"></div>

    <div class="zoom-group">
      <button onclick="stepZoom(-0.25)" title="Afastar (Zoom Out)">➖</button>
      <span class="zoom-level-text" id="zoomText">100%</span>
      <button onclick="stepZoom(0.25)" title="Aproximar (Zoom In)">➕</button>
      <button onclick="resetZoom()" title="Reset Zoom (100%)">🔍 100%</button>
      <button onclick="zoomToFit()" title="Ajustar Mapa à Tela">🖼️ Centrar</button>
    </div>

    <button onclick="exportSVG()" style="background-color: #16a34a; border-color: #22c55e; margin-left: auto;">💾 Exportar SVG</button>
  </div>

  <div class="app-body">
    <div class="ruler-container">
      <div class="ruler-corner"></div>
      <canvas id="rulerTop" class="ruler-top" height="24"></canvas>
      <canvas id="rulerLeft" class="ruler-left" width="24"></canvas>

      <div class="main-container" id="mainContainer">
        <div class="canvas-wrapper" id="canvasWrapper">
          <canvas id="vectorCanvas" width="1200" height="800"></canvas>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-header">
        <h3>Estrutura de Camadas (<span id="layerCount">0</span>)</h3>
        <button onclick="createFolder()" class="btn-icon" style="background-color: #334155; padding: 4px 8px;" title="Nova Pasta">📁 Criar Pasta</button>
      </div>

      <div class="progress-box" id="progressBox">
        <div style="display: flex; justify-content: space-between;">
          <span id="progressText">A processar camadas...</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
      </div>

      <div class="layer-list" id="layerList">
        <div style="font-size: 11px; color: #64748b; text-align: center; margin-top: 20px;">
          Nenhum elemento no canvas
        </div>
      </div>
    </div>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <script>
    const canvas = new fabric.Canvas('vectorCanvas', {
      isDrawingMode: false,
      selection: true,
      preserveObjectStacking: true,
      renderOnAddRemove: false,
      subTargetCheck: false,
      enableRetinaScaling: false,
      perPixelTargetFind: true,
      targetFindTolerance: 3
    });

    let currentTool = 'select';
    let isHandDragging = false;
    let handLastX = 0, handLastY = 0;
    let isBatchUpdating = false;

    let pathPoints = [];
    let activePathLine = null;
    let clipboard = null;
    let targetEraserObj = null;
    let showGrid = false;
    const folders = [];

    // Estado local para formatação de texto
    let currentTextAlign = 'left';
    let isBoldActive = false;

    const CUSTOM_PROPS = ['rawSVGData', 'customName', 'folderId', 'fontFamily', 'textAlign', 'fontWeight'];

    // -------------------------------------------------------------
    // HISTÓRICO UNDO INSTANTÂNEO
    // -------------------------------------------------------------
    const undoStack = [];
    let isUndoRedoOperation = false;
    const MAX_UNDO_LEVELS = 30;

    function saveState() {
      if (isBatchUpdating || isUndoRedoOperation) return;

      const jsonState = canvas.toDatalessJSON(CUSTOM_PROPS);
      const strState = JSON.stringify(jsonState);

      if (undoStack.length > 0 && undoStack[undoStack.length - 1] === strState) {
        return;
      }

      undoStack.push(strState);

      if (undoStack.length > MAX_UNDO_LEVELS) {
        undoStack.shift();
      }
    }

    function undo() {
      if (undoStack.length <= 1) {
        showStatus('⚠️ Sem mais ações para desfazer.');
        return;
      }

      isUndoRedoOperation = true;
      undoStack.pop();
      const previousState = JSON.parse(undoStack[undoStack.length - 1]);

      canvas.loadFromJSON(previousState, function () {
        canvas.renderAll();
        updateLayerPanel();
        updateZoomIndicator();
        drawRulers();
        isUndoRedoOperation = false;
        showStatus('↩️ Ação desfeita!');
      });
    }

    setTimeout(saveState, 300);

    function saveToStorage() {
      try {
        const jsonState = JSON.stringify(canvas.toJSON(CUSTOM_PROPS));
        localStorage.setItem('infralobo_canvas_project', jsonState);
        showStatus('💾 Projeto guardado na cache do browser com sucesso!');
      } catch (e) {
        showStatus('⚠️ O mapa é demasiado grande para a memória local do browser.');
      }
    }

    function loadFromStorage() {
      const savedData = localStorage.getItem('infralobo_canvas_project');
      if (!savedData) {
        showStatus('⚠️ Nenhuns dados guardados na cache.');
        return;
      }

      showStatus('⏳ A carregar projeto da cache...');
      isUndoRedoOperation = true;

      canvas.loadFromJSON(savedData, function () {
        canvas.renderAll();
        updateLayerPanel();
        updateZoomIndicator();
        drawRulers();
        undoStack.length = 0;
        saveState();
        isUndoRedoOperation = false;
        showStatus('📂 Projeto restaurado da cache!');
      });
    }

    function showStatus(msg) {
      const el = document.getElementById('statusMsg');
      el.innerText = msg;
      el.style.display = 'block';
      setTimeout(() => el.style.display = 'none', 3000);
    }

    function updateProgress(current, total, label = 'A processar camadas...') {
      const box = document.getElementById('progressBox');
      const text = document.getElementById('progressText');
      const percent = document.getElementById('progressPercent');
      const fill = document.getElementById('progressBarFill');

      if (total === 0 || current >= total) {
        box.style.display = 'none';
        fill.style.width = '0%';
        return;
      }

      box.style.display = 'flex';
      const pct = Math.round((current / total) * 100);
      text.innerText = label;
      percent.innerText = `${pct}%`;
      fill.style.width = `${pct}%`;
    }

    // -------------------------------------------------------------
    // GESTÃO DE TEXTO, FONTE, NEGRITO E ALINHAMENTO
    // -------------------------------------------------------------
    function addText() {
      setActiveTool('select');
      const selectedFont = document.getElementById('fontSelect').value;

      const text = new fabric.Textbox('NOVO TEXTO', {
        left: canvas.width / 2 - 50,
        top: canvas.height / 2 - 15,
        fill: document.getElementById('fillColor').value || '#000000',
        fontSize: 22,
        fontFamily: selectedFont,
        fontWeight: isBoldActive ? 'bold' : 'normal',
        textAlign: currentTextAlign,
        cornerColor: '#0d9488',
        cornerStyle: 'circle',
        transparentCorners: false
      });

      canvas.add(text);
      canvas.setActiveObject(text);

      document.fonts.ready.then(() => {
        text.initDimensions();
        canvas.renderAll();
      });

      saveState();
      showStatus(`🔤 Texto adicionado!`);
    }

    function updateFontFamily(font) {
      const activeObj = canvas.getActiveObject();
      if (activeObj && activeObj.type === 'textbox') {
        activeObj.set('fontFamily', font);
        document.fonts.ready.then(() => {
          activeObj.initDimensions();
          canvas.renderAll();
        });
        saveState();
        showStatus(`🔤 Fonte alterada para ${font}`);
      }
    }

    function toggleBold() {
      isBoldActive = !isBoldActive;
      document.getElementById('btnBold').classList.toggle('active', isBoldActive);

      const activeObj = canvas.getActiveObject();
      if (activeObj && activeObj.type === 'textbox') {
        activeObj.set('fontWeight', isBoldActive ? 'bold' : 'normal');
        canvas.renderAll();
        saveState();
        showStatus(isBoldActive ? '<b>B</b> Negrito ativado' : 'Negrito desativado');
      }
    }

    function setTextAlignment(align) {
      currentTextAlign = align;

      document.getElementById('btnAlignLeft').classList.toggle('active', align === 'left');
      document.getElementById('btnAlignCenter').classList.toggle('active', align === 'center');
      document.getElementById('btnAlignRight').classList.toggle('active', align === 'right');

      const activeObj = canvas.getActiveObject();
      if (activeObj && activeObj.type === 'textbox') {
        activeObj.set('textAlign', align);
        canvas.renderAll();
        saveState();
      }
    }

    canvas.on('selection:created', checkSelectedTextProperties);
    canvas.on('selection:updated', checkSelectedTextProperties);

    function checkSelectedTextProperties() {
      const activeObj = canvas.getActiveObject();
      if (activeObj && activeObj.type === 'textbox') {
        document.getElementById('fontSelect').value = activeObj.fontFamily || 'Nunito';
        
        isBoldActive = (activeObj.fontWeight === 'bold' || activeObj.fontWeight === '700' || activeObj.fontWeight === 700);
        document.getElementById('btnBold').classList.toggle('active', isBoldActive);

        currentTextAlign = activeObj.textAlign || 'left';
        document.getElementById('btnAlignLeft').classList.toggle('active', currentTextAlign === 'left');
        document.getElementById('btnAlignCenter').classList.toggle('active', currentTextAlign === 'center');
        document.getElementById('btnAlignRight').classList.toggle('active', currentTextAlign === 'right');
      }
    }

    // -------------------------------------------------------------
    // FERRAMENTAS E MÃO
    // -------------------------------------------------------------
    function updateEraserSize(val) {
      document.getElementById('eraserSizeVal').innerText = val + 'px';
      if (currentTool === 'eraser' && canvas.freeDrawingBrush) {
        const currentZoom = canvas.getZoom();
        canvas.freeDrawingBrush.width = Math.max(0.1, parseInt(val, 10) / currentZoom);
      }
    }

    function setActiveTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.toolbar button').forEach(btn => {
        if (!['btnBold', 'btnAlignLeft', 'btnAlignCenter', 'btnAlignRight', 'btnGrid'].includes(btn.id)) {
          btn.classList.remove('active');
        }
      });

      canvas.isDrawingMode = false;

      if (tool === 'select') {
        document.getElementById('btnSelect').classList.add('active');
        canvas.selection = true;
        canvas.defaultCursor = 'default';
        if (targetEraserObj) {
          targetEraserObj.set({ stroke: null, strokeWidth: 0 });
          targetEraserObj = null;
        }
        setObjectsInteractive(true);
      } else if (tool === 'hand') {
        document.getElementById('btnHand').classList.add('active');
        canvas.selection = false;
        canvas.defaultCursor = 'grab';
        if (targetEraserObj) {
          targetEraserObj.set({ stroke: null, strokeWidth: 0 });
          targetEraserObj = null;
        }
        setObjectsInteractive(false);
      } else if (tool === 'eraser') {
        const activeObj = canvas.getActiveObject() || targetEraserObj;
        if (!activeObj) {
          showStatus('⚠️ Seleciona primeiro a camada que queres apagar com a borracha!');
          setActiveTool('select');
          return;
        }

        targetEraserObj = activeObj;
        targetEraserObj.set({ stroke: '#22c55e', strokeWidth: 2 / canvas.getZoom() });

        document.getElementById('btnEraser').classList.add('active');
        canvas.isDrawingMode = true;

        const eraserBrush = new fabric.PencilBrush(canvas);
        eraserBrush.color = '#ffffff';
        eraserBrush.width = Math.max(0.1, parseInt(document.getElementById('eraserSize').value, 10) / canvas.getZoom());
        canvas.freeDrawingBrush = eraserBrush;

        setObjectsInteractive(false);
        canvas.renderAll();
        showStatus('🧹 Borracha ativa no objeto verde!');
      } else if (tool === 'path') {
        document.getElementById('btnPath').classList.add('active');
        canvas.selection = false;
        canvas.defaultCursor = 'crosshair';
        setObjectsInteractive(false);
        showStatus('📐 Modo Pen: Clica no canvas para adicionar pontos.');
      } else if (tool === 'pencil') {
        document.getElementById('btnPencil').classList.add('active');
        canvas.isDrawingMode = true;
        const pencil = new fabric.PencilBrush(canvas);
        pencil.color = document.getElementById('fillColor').value || '#000000';
        pencil.width = 3;
        canvas.freeDrawingBrush = pencil;
        setObjectsInteractive(false);
      }

    canvas.on('path:created', function (opt) {
      if (currentTool === 'eraser' && targetEraserObj) {
        const pathObj = opt.path;

        if (!targetEraserObj.clipPath) {
          targetEraserObj.clipPath = new fabric.Group([], { originX: 'center', originY: 'center', inverted: true });
        }

        const invMatrix = fabric.util.invertTransform(targetEraserObj.calcTransformMatrix());
        const localCenter = fabric.util.transformPoint(pathObj.getCenterPoint(), invMatrix);

        pathObj.set({
          left: localCenter.x,
          top: localCenter.y,
          originX: 'center',
          originY: 'center',
          scaleX: pathObj.scaleX / targetEraserObj.scaleX,
          scaleY: pathObj.scaleY / targetEraserObj.scaleY,
          fill: null,
          stroke: '#000000',
          strokeWidth: pathObj.strokeWidth / targetEraserObj.scaleX
        });

        if (targetEraserObj.clipPath.addWithUpdate) {
          targetEraserObj.clipPath.addWithUpdate(pathObj);
        } else if (targetEraserObj.clipPath._objects) {
          targetEraserObj.clipPath._objects.push(pathObj);
        }

        targetEraserObj.setCoords();
        canvas.requestRenderAll();

    function prepareSVGWithStyles(svgString) {
      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(svgString, 'image/svg+xml');
        const parserError = doc.querySelector('parsererror');
        if (parserError) return svgString;

        const svgEl = doc.documentElement;
        if (!svgEl || svgEl.tagName.toLowerCase() !== 'svg') return svgString;

        const styleElements = svgEl.querySelectorAll('style');
        let cssRules = [];

        styleElements.forEach(styleEl => {
          const cssText = styleEl.textContent || '';
          const ruleRegex = /([^{}]+)\{([^{}]*)\}/g;
          let match;
          while ((match = ruleRegex.exec(cssText)) !== null) {
            const selectors = match[1].trim().split(',').map(s => s.trim());
            const propsText = match[2].trim();
            const props = {};
            propsText.split(';').forEach(prop => {
              const parts = prop.split(':').map(p => p.trim());
              if (parts.length === 2) {
                props[parts[0]] = parts[1];
              }
            });
            selectors.forEach(sel => {
              cssRules.push({ selector: sel, props: props });
            });
          }
        });

        function hasInlineStyleProp(el, prop) {
          const styleAttr = el.getAttribute('style');
          if (!styleAttr) return false;
          const re = new RegExp('(^|;)\\s*' + prop + '\\s*:', 'i');
          return re.test(styleAttr);
        }

        function applyStyleToElement(el, rules) {
          rules.forEach(rule => {
            const sel = rule.selector;
            let matches = false;

            if (sel.startsWith('.')) {
              const className = sel.substring(1);
              if (el.getAttribute('class')) {
                const classes = el.getAttribute('class').trim().split(/\s+/);
                if (classes.includes(className)) matches = true;
              }
            } else if (sel.startsWith('#')) {
              const id = sel.substring(1);
              if (el.getAttribute('id') === id) matches = true;
            } else if (sel === el.tagName.toLowerCase()) {
              matches = true;
            }

            if (matches) {
              Object.keys(rule.props).forEach(prop => {
                if (!hasInlineStyleProp(el, prop)) {
                  el.setAttribute(prop, rule.props[prop]);
                }
              });
            }
          });
        }

        if (cssRules.length > 0) {
          const allElements = svgEl.querySelectorAll('*');
          allElements.forEach(el => applyStyleToElement(el, cssRules));
          styleElements.forEach(s => s.remove());
        }

        const XLINK_NS = 'http://www.w3.org/1999/xlink';
        const hrefElements = svgEl.querySelectorAll('image[href], use[href]');
        hrefElements.forEach(el => {
          if (!el.hasAttribute('xlink:href') && !el.getAttributeNS(XLINK_NS, 'href')) {
            const hrefValue = el.getAttribute('href');
            if (hrefValue) el.setAttributeNS(XLINK_NS, 'xlink:href', hrefValue);
          }
        });
        if (!svgEl.getAttribute('xmlns:xlink')) {
          svgEl.setAttribute('xmlns:xlink', XLINK_NS);
        }

        const serializer = new XMLSerializer();
        return serializer.serializeToString(doc);

      } catch (err) {
        return svgString;
      }
    }

    function loadSVGFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      showStatus('⏳ A carregar vetor com fidelidade nativa de cores...');
      const reader = new FileReader();

      reader.onload = function (f) {
        const svgString = f.target.result;
        const processedSVG = prepareSVGWithStyles(svgString);

        const blob = new Blob([processedSVG], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        fabric.Image.fromURL(url, function (img) {
          if (!img) {
            showStatus('⚠️ Erro ao renderizar o ficheiro SVG.');
            return;
          }

          img.rawSVGData = processedSVG;

          const scale = Math.min(
            (canvas.width * 0.85) / img.width,
            (canvas.height * 0.85) / img.height
          );

          img.set({
            scaleX: scale,
            scaleY: scale,
            left: canvas.width / 2,
            top: canvas.height / 2,
            originX: 'center',
            originY: 'center',
            cornerColor: '#0d9488',
            cornerStyle: 'circle',
            transparentCorners: false,
            objectCaching: true,
            noScaleCache: false
          });

          canvas.clear();
          undoStack.length = 0;

          canvas.add(img);
          canvas.setActiveObject(img);
          canvas.renderAll();

          setActiveTool('select');
          updateLayerPanel();
          updateZoomIndicator();
          saveState();
          showStatus('✅ Mapa e cores carregados com precisão!');
        });
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    canvas.on('mouse:down', function (opt) {
      if (currentTool === 'hand') {
        isHandDragging = true;
        canvas.defaultCursor = 'grabbing';
        handLastX = opt.e.clientX;
        handLastY = opt.e.clientY;
      } else if (currentTool === 'path') {
        const pointer = canvas.getPointer(opt.e);
        pathPoints.push({ x: pointer.x, y: pointer.y });
        drawPolylinePath(false);
      }
    });

    canvas.on('mouse:move', function (opt) {
      if (isHandDragging && currentTool === 'hand') {
        const e = opt.e;
        const vpt = canvas.viewportTransform;
        vpt[4] += e.clientX - handLastX;
        vpt[5] += e.clientY - handLastY;
        canvas.requestRenderAll();
        drawRulers();
        handLastX = e.clientX;
        handLastY = e.clientY;
      }
    });

    canvas.on('mouse:up', function () {
      if (currentTool === 'hand') {

    function drawPolylinePath(isClosed = false) {
      if (activePathLine) canvas.remove(activePathLine);
      if (pathPoints.length < 2) return;

      const strokeColor = document.getElementById('fillColor').value || '#000000';

      if (isClosed) {
        activePathLine = new fabric.Polygon(pathPoints, {
          stroke: strokeColor,
          fill: strokeColor + '33',
          strokeWidth: 3,
          cornerColor: '#0d9488',
          cornerStyle: 'circle',
          transparentCorners: false
        });
      } else {
        activePathLine = new fabric.Polyline(pathPoints, {
          stroke: strokeColor,
          fill: 'transparent',
          strokeWidth: 3,
          cornerColor: '#0d9488',
          cornerStyle: 'circle',
          transparentCorners: false
        });
      }

      applyDashToObj(activePathLine);
      canvas.add(activePathLine);
      canvas.renderAll();
    }

    function closeCurrentPath() {
      if (pathPoints.length > 2) {
        drawPolylinePath(true);
        finishPath();
      } else {
        showStatus('⚠️ Precisa de pelo menos 3 pontos para fechar o caminho.');

        showStatus('📐 Caminho vetorial concluído!');

    // -------------------------------------------------------------
    // RÉGUAS E GUIAS
    // -------------------------------------------------------------
    const rulerTopCanvas = document.getElementById('rulerTop');
    const rulerLeftCanvas = document.getElementById('rulerLeft');
    const rulerTopCtx = rulerTopCanvas.getContext('2d');
    const rulerLeftCtx = rulerLeftCanvas.getContext('2d');

    function drawRulers() {
      const container = document.getElementById('mainContainer');
      rulerTopCanvas.width = container.clientWidth;
      rulerLeftCanvas.height = container.clientHeight;

      const zoom = canvas.getZoom();
      const vpt = canvas.viewportTransform;

      rulerTopCtx.clearRect(0, 0, rulerTopCanvas.width, rulerTopCanvas.height);
      rulerTopCtx.fillStyle = '#1e293b';
      rulerTopCtx.fillRect(0, 0, rulerTopCanvas.width, 24);
      rulerTopCtx.strokeStyle = '#64748b';
      rulerTopCtx.fillStyle = '#94a3b8';
      rulerTopCtx.font = '9px sans-serif';

      const startX = vpt[4];
      for (let x = 0; x < rulerTopCanvas.width; x += 50 * zoom) {
        const posX = startX + x;
        rulerTopCtx.beginPath();
        rulerTopCtx.moveTo(posX, 14);
        rulerTopCtx.lineTo(posX, 24);
        rulerTopCtx.stroke();
        rulerTopCtx.fillText(Math.round(x / zoom), posX + 3, 12);
      }

      rulerLeftCtx.clearRect(0, 0, rulerLeftCanvas.width, rulerLeftCanvas.height);
      rulerLeftCtx.fillStyle = '#1e293b';
      rulerLeftCtx.fillRect(0, 0, 24, rulerLeftCanvas.height);
      rulerLeftCtx.strokeStyle = '#64748b';
      rulerLeftCtx.fillStyle = '#94a3b8';

      const startY = vpt[5];
      for (let y = 0; y < rulerLeftCanvas.height; y += 50 * zoom) {
        const posY = startY + y;
        rulerLeftCtx.beginPath();
        rulerLeftCtx.moveTo(14, posY);
        rulerLeftCtx.lineTo(24, posY);
        rulerLeftCtx.stroke();
      }
    }

    let isDraggingRuler = null;

    rulerTopCanvas.addEventListener('mousedown', () => isDraggingRuler = 'H');
    rulerLeftCanvas.addEventListener('mousedown', () => isDraggingRuler = 'V');

    window.addEventListener('mouseup', (e) => {
      if (isDraggingRuler) {
        const mainRect = document.getElementById('mainContainer').getBoundingClientRect();
        if (isDraggingRuler === 'H') {
          createGuide('H', e.clientY - mainRect.top);
        } else {
          createGuide('V', e.clientX - mainRect.left);
        }
        isDraggingRuler = null;

      else guide.style.left = pos + 'px';

    function applyDashToObj(obj) {
      const type = document.getElementById('strokeDashSelect').value;
      if (type === 'solid') obj.set('strokeDashArray', null);
      else if (type === 'dashed') obj.set('strokeDashArray', [10, 5]);
      else if (type === 'dotted') obj.set('strokeDashArray', [3, 3]);
    }

    function updateColor(color) {
      if (canvas.isDrawingMode && currentTool === 'pencil') {
        canvas.freeDrawingBrush.color = color;
      } else {
        const activeObj = canvas.getActiveObject();
        if (activeObj) {
          if (activeObj.type === 'activeSelection' || activeObj.type === 'group') {
            const objs = activeObj.getObjects ? activeObj.getObjects() : [];
            objs.forEach(obj => {
              if (obj.fill && obj.fill !== 'transparent') obj.set('fill', color);
              if (obj.stroke) obj.set('stroke', color);
            });
          } else {
            if (activeObj.fill && activeObj.fill !== 'transparent') activeObj.set('fill', color);
            if (activeObj.stroke) activeObj.set('stroke', color);
          }
          canvas.renderAll();
          saveState();
        }
      }
    }

    async function ungroupSelected() {
      const activeObj = canvas.getActiveObject();
      if (!activeObj) {
        showStatus('⚠️ Seleciona primeiro a camada do mapa no canvas ou na lista.');
        return;
      }

      isBatchUpdating = true;

      if (activeObj.type === 'image' && activeObj.rawSVGData) {
        showStatus('⏳ A extrair sub-camadas com cores preservadas...');
        updateProgress(1, 100, 'A preparar estilo...');

        const preparedSVG = activeObj.rawSVGData;

        const origScaleX = activeObj.scaleX || 1;
        const origScaleY = activeObj.scaleY || 1;
        const origLeft = activeObj.left;
        const origTop = activeObj.top;

        fabric.loadSVGFromString(activeObj.rawSVGData, async function (objects, options) {
          if (!objects || objects.length === 0) {
            showStatus('⚠️ Não foram encontradas sub-camadas.');
            updateProgress(0, 0);
            isBatchUpdating = false;
            return;
          }

          canvas.remove(activeObj);
          const total = objects.length;
          const chunkSize = 50;

          for (let i = 0; i < total; i += chunkSize) {
            const chunk = objects.slice(i, i + chunkSize);

            chunk.forEach(obj => {
              if (obj) {
                obj.set({
                  scaleX: obj.scaleX * origScaleX,
                  scaleY: obj.scaleY * origScaleY,
                  left: origLeft + (obj.left - (options.width / 2 || 0)) * origScaleX,
                  top: origTop + (obj.top - (options.height / 2 || 0)) * origScaleY,
                  cornerColor: '#0d9488',
                  cornerStyle: 'circle',
                  transparentCorners: false,
                  objectCaching: false
                });
                canvas.add(obj);
              }
            });

            const currentCount = Math.min(i + chunkSize, total);
            updateProgress(currentCount, total, `A importar ${currentCount} de ${total}...`);
            await new Promise(r => setTimeout(r, 15));
          }

          isBatchUpdating = false;
          updateProgress(total, total);
          canvas.renderAll();
          updateLayerPanel();
          saveState();
          showStatus(`🔓 Desagrupado com sucesso! (${total} sub-camadas)`);
        });
        return;
      }

      if (activeObj.type === 'group') {
        const items = activeObj.getObjects();
        activeObj._restoreObjectsState();
        canvas.remove(activeObj);

        items.forEach(item => {
          item.set({
            cornerColor: '#0d9488',
            cornerStyle: 'circle',
            transparentCorners: false,
            objectCaching: false
          });
          canvas.add(item);
        });

        isBatchUpdating = false;
        canvas.renderAll();
        updateLayerPanel();
        saveState();
        showStatus(`🔓 Desagrupado com sucesso!`);
      } else {
        isBatchUpdating = false;
        showStatus('💡 Esta camada já é um elemento individual.');
      }
    }

    function copySelected() {
      const activeObj = canvas.getActiveObject();
      if (!activeObj) {
        showStatus('⚠️ Nenhuma camada selecionada para copiar.');
        return;
      }

      activeObj.clone(function (cloned) {
        clipboard = cloned;
        showStatus('📋 Camada copiada para a área de transferência.');
      }, CUSTOM_PROPS);
    }

    function cutSelected() {
      const activeObj = canvas.getActiveObject();
      if (!activeObj) {
        showStatus('⚠️ Nenhuma camada selecionada para cortar.');
        return;
      }

      copySelected();
      canvas.remove(activeObj);
      canvas.discardActiveObject();
      canvas.renderAll();
      updateLayerPanel();
      saveState();
      showStatus('✂️ Camada recortada.');
    }

    function pasteSelected() {
      if (!clipboard) {
        showStatus('⚠️ A área de transferência está vazia.');
        return;
      }

      clipboard.clone(function (clonedObj) {
        canvas.discardActiveObject();

        clonedObj.set({
          left: clonedObj.left + 20,
          top: clonedObj.top + 20,
          evented: true,
          selectable: true,
          cornerColor: '#0d9488',
          cornerStyle: 'circle',
          transparentCorners: false
        });

        if (clonedObj.type === 'activeSelection') {
          clonedObj.canvas = canvas;
          clonedObj.forEachObject(function (obj) {
            canvas.add(obj);
          });
          clonedObj.setCoords();
        } else {
          if (clipboard.customName) {
            clonedObj.customName = clipboard.customName + ' (Cópia)';
          }
          canvas.add(clonedObj);
        }

        clipboard.top += 10;
        clipboard.left += 10;

        canvas.setActiveObject(clonedObj);
        canvas.renderAll();
        updateLayerPanel();
        saveState();
        showStatus('📌 Camada colada com sucesso!');
      }, CUSTOM_PROPS);
    }

    function deleteSelected() {
      const activeObjects = canvas.getActiveObjects();
      if (activeObjects.length) {
        activeObjects.forEach(obj => canvas.remove(obj));
        canvas.discardActiveObject();
        canvas.renderAll();
        updateLayerPanel();
        saveState();
      }
    }

    canvas.on('object:modified', saveState);

    // ATALHOS DE TECLADO
    window.addEventListener('keydown', function (e) {
      if (['input', 'textarea', 'select'].includes(e.target.tagName.toLowerCase())) return;

      if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
        e.preventDefault();
        undo();
      } else if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        saveToStorage();
      } else if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
        e.preventDefault();
        copySelected();
      } else if ((e.ctrlKey || e.metaKey) && e.key === 'x') {
        e.preventDefault();
        cutSelected();
      } else if ((e.ctrlKey || e.metaKey) && e.key === 'v') {
        e.preventDefault();
        pasteSelected();
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        if (currentTool === 'select' && canvas.getActiveObject()) {
          e.preventDefault();
          deleteSelected();
        }
      } else if (currentTool === 'path') {
        if (e.key === 'Enter') finishPath();
        if (e.key === 'Escape') cancelPath();
      }
    });

    // -------------------------------------------------------------
    // PAINEL DE CAMADAS E PASTAS
    // -------------------------------------------------------------
    function createFolder() {
      const name = prompt('Nome da nova pasta:', `Pasta ${folders.length + 1}`);
      if (name) {
        folders.push({ id: 'folder_' + Date.now(), name: name, open: true });
        updateLayerPanel();
        showStatus('📁 Pasta criada!');
      }
    }

    function updateLayerPanel() {
      if (isBatchUpdating) return;

      const layerList = document.getElementById('layerList');
      const objects = canvas.getObjects();
      document.getElementById('layerCount').innerText = objects.length;
      layerList.innerHTML = '';

      if (objects.length === 0 && folders.length === 0) {
        layerList.innerHTML = '<div style="font-size: 11px; color: #64748b; text-align: center; margin-top: 20px;">Nenhum elemento no canvas</div>';
        return;
      }

      folders.forEach(folder => {
        const folderEl = document.createElement('div');
        folderEl.className = 'folder-item';

        folderEl.innerHTML = `
          <div class="folder-header">
            <span onclick="toggleFolder('${folder.id}')">📁 ${folder.name}</span>
            <div>
              <button class="btn-icon" onclick="renameFolder('${folder.id}')">✏️</button>
              <button class="btn-icon" onclick="deleteFolder('${folder.id}')">🗑️</button>
            </div>
          </div>
          <div class="folder-content" id="${folder.id}" style="display: ${folder.open ? 'flex' : 'none'};"></div>
        `;
        layerList.appendChild(folderEl);
      });

      const activeObject = canvas.getActiveObject() || targetEraserObj;

      [...objects].reverse().forEach((obj, idx) => {
        const item = document.createElement('div');
        const isPathObj = ['polyline', 'polygon', 'path'].includes(obj.type);
        const realIndex = objects.length - 1 - idx;

        item.className = 'layer-item' + (isPathObj ? ' is-path' : '');

        const isSelected = activeObject === obj || (activeObject && activeObject.type === 'activeSelection' && activeObject.contains && activeObject.contains(obj));
        if (isSelected) {
          item.classList.add('active');
        }

        let name = obj.customName;
        if (!name) {
          if (obj.type === 'rect') name = '🟦 Retângulo';
          else if (obj.type === 'circle') name = '🟠 Círculo';
          else if (obj.type === 'line') name = '➖ Linha';
          else if (obj.type === 'polyline') name = `📐 Path (${obj.points ? obj.points.length : 0} pts)`;
          else if (obj.type === 'polygon') name = `📐 Polígono (${obj.points ? obj.points.length : 0} pts)`;
          else if (obj.type === 'textbox') name = `🔤 Texto (${obj.text ? obj.text.substring(0, 10) : ''})`;
          else if (obj.type === 'group') name = `📦 Grupo (${obj.getObjects().length} elem.)`;
          else if (obj.type === 'image') name = '🗺️ Mapa Vetorial Completo';
          else if (obj.type === 'path') name = '✏️ Path / Símbolo';
          else name = 'Sub-camada Vetorial';
        }

        const isVisible = obj.visible !== false;

        item.innerHTML = `
          <div class="layer-info">
            <span title="Duplo clique para renomear" ondblclick="renameLayer(event, ${realIndex})">${name}</span>
          </div>
          <div class="layer-actions">
            <select style="font-size: 10px; padding: 2px; background-color: #1e293b; color: #fff; border: 1px solid #475569; border-radius: 3px;" onchange="moveObjToFolder(${realIndex}, this.value)">
              <option value="">Sem Pasta</option>
              ${folders.map(f => `<option value="${f.id}" ${obj.folderId === f.id ? 'selected' : ''}>${f.name}</option>`).join('')}
            </select>
            <button class="btn-icon" title="Renomear" onclick="renameLayer(event, ${realIndex})">✏️</button>
            <button class="btn-icon" title="${isVisible ? 'Ocultar' : 'Mostrar'}" onclick="toggleVisibility(event, ${realIndex})">
              ${isVisible ? '👁️' : '🙈'}
            </button>
          </div>
        `;

        item.onclick = function (e) {
          if (['BUTTON', 'SELECT'].includes(e.target.tagName)) return;
          if (currentTool === 'select') {
            if (obj.visible !== false) {
              canvas.setActiveObject(obj);
              canvas.renderAll();
              updateLayerPanel();
            } else {
              showStatus('💡 Torne a camada visível antes de a selecionar.');
            }
          }
        };

        if (obj.folderId && document.getElementById(obj.folderId)) {
          document.getElementById(obj.folderId).appendChild(item);
        } else {
          layerList.appendChild(item);
        }
      });
    }

    function toggleFolder(id) {
      const f = folders.find(f => f.id === id);
      if (f) {
        f.open = !f.open;
        updateLayerPanel();
      }
    }

    function renameFolder(id) {
      const f = folders.find(f => f.id === id);
      if (f) {
        const newName = prompt('Novo nome para a pasta:', f.name);
        if (newName) { f.name = newName; updateLayerPanel(); }
      }
    }

    function deleteFolder(id) {
      const idx = folders.findIndex(f => f.id === id);
      if (idx !== -1) {
        canvas.getObjects().forEach(o => { if (o.folderId === id) delete o.folderId; });
        folders.splice(idx, 1);
        updateLayerPanel();
      }
    }

    function moveObjToFolder(objIdx, folderId) {
      const obj = canvas.getObjects()[objIdx];
      if (obj) {
        obj.folderId = folderId || null;
        updateLayerPanel();
        saveState();
      }
    }

    function renameLayer(e, realIndex) {
      e.stopPropagation();
      const objects = canvas.getObjects();
      const obj = objects[realIndex];
      if (obj) {
        const currentName = obj.customName || '';
        const newName = prompt('Novo nome para esta camada:', currentName);
        if (newName !== null && newName.trim() !== '') {
          obj.customName = newName.trim();
          updateLayerPanel();
          saveState();
          showStatus('🏷️ Camada renomeada!');
        }
      }
    }

    function toggleVisibility(e, realIndex) {
      e.stopPropagation();
      const objects = canvas.getObjects();
      const obj = objects[realIndex];
      if (obj) {
        obj.visible = !obj.visible;
        if (!obj.visible && canvas.getActiveObject() === obj) {
          canvas.discardActiveObject();
        }
        canvas.renderAll();
        updateLayerPanel();
      }
    }

    canvas.on('object:added', updateLayerPanel);
    canvas.on('object:removed', updateLayerPanel);
    canvas.on('selection:created', updateLayerPanel);
    canvas.on('selection:updated', updateLayerPanel);
    canvas.on('selection:cleared', updateLayerPanel);

    // -------------------------------------------------------------
    // CONTROLO DE ZOOM
    // -------------------------------------------------------------
    function updateZoomIndicator() {
      const zoomPercent = Math.round(canvas.getZoom() * 100);
      document.getElementById('zoomText').innerText = `${zoomPercent}%`;
      
      if (currentTool === 'eraser' && canvas.freeDrawingBrush) {
        const size = parseInt(document.getElementById('eraserSize').value, 10);
        canvas.freeDrawingBrush.width = Math.max(0.1, size / canvas.getZoom());
      }
      drawRulers();
    }

    canvas.on('mouse:wheel', function (opt) {
      const e = opt.e;
      let zoom = canvas.getZoom();

      zoom *= Math.pow(0.998, e.deltaY);
      zoom = Math.max(0.05, Math.min(500, zoom));

      canvas.zoomToPoint(new fabric.Point(e.offsetX, e.offsetY), zoom);
      updateZoomIndicator();

      e.preventDefault();
      e.stopPropagation();
      canvas.requestRenderAll();
    });

    function stepZoom(delta) {
      let zoom = canvas.getZoom();
      zoom += delta;
      zoom = Math.max(0.05, Math.min(500, zoom));
      
      const center = canvas.getCenter();
      canvas.zoomToPoint(new fabric.Point(center.left, center.top), zoom);
      updateZoomIndicator();
      canvas.requestRenderAll();
    }

    function resetZoom() {
      canvas.setViewportTransform([1, 0, 0, 1, 0, 0]);
      updateZoomIndicator();
      canvas.requestRenderAll();
    }

    function zoomToFit() {
      const objects = canvas.getObjects();
      if (objects.length === 0) return;

      const group = new fabric.Group(objects);
      const groupWidth = group.width * group.scaleX;
      const groupHeight = group.height * group.scaleY;

      const scaleX = (canvas.width * 0.9) / groupWidth;
      const scaleY = (canvas.height * 0.9) / groupHeight;
      let zoom = Math.min(scaleX, scaleY);
      zoom = Math.max(0.05, Math.min(500, zoom));

      canvas.setZoom(zoom);
      
      const vpt = canvas.viewportTransform;
      vpt[4] = (canvas.width / 2) - (group.left * zoom);
      vpt[5] = (canvas.height / 2) - (group.top * zoom);

      updateZoomIndicator();
      canvas.requestRenderAll();
    }

    function exportSVG() {
      const svgData = canvas.toSVG();
      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'desenho_vetorial.svg';
      link.click();
    }

    document.getElementById('mainContainer').onscroll = drawRulers;
    window.onresize = drawRulers;
    setTimeout(drawRulers, 300);
  </script>
</body>
